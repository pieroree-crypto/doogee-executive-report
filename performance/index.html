    const importKey=(raw)=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    async function derive(password){
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
      return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:fromB64(envelope.salt),iterations:envelope.iterations},material,256));

    async function unlock(raw,remember,openInitial=false){
      try{
        const key=await importKey(raw);
        const compressed=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(envelope.iv)},key,fromB64(envelope.ciphertext));

        if(remember)sessionStorage.setItem(cacheKey,toB64(raw));
        if(openInitial&&initialTarget&&!sessionStorage.getItem(initialOpenKey)){

          location.replace(initialTarget);
          return true;

        const parsed=new DOMParser().parseFromString(new TextDecoder().decode(plain),"text/html");
        document.documentElement.lang=parsed.documentElement.lang||"zh-CN";
        document.head.replaceWith(parsed.head);
        document.body.replaceWith(parsed.body);
        for(const oldScript of Array.from(document.querySelectorAll("script"))){
          const activeScript=document.createElement("script");
          for(const attribute of Array.from(oldScript.attributes))activeScript.setAttribute(attribute.name,attribute.value);

          oldScript.replaceWith(activeScript);
        }
        return true;
